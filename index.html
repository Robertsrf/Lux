    <meta charset="UTF-8" />

    <meta name="theme-color" content="#1F4045" />
    <meta name="description" content="Sistema de inventario y ventas de Lux by Emory." />

    <!-- Sello L en verde profundo, generado por npm run logos -->

         valen para todo el sitio, no por pantalla. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lux by Emory" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:title" content="Lux by Emory — Catalogo" />
    <meta property="og:description" content="Joyeria hipoalergenica. Mira las piezas disponibles y arma tu pedido al mayor." />
    <meta property="og:url" content="https://robertsrf.github.io/Lux/#/publico" />
    <meta property="og:image" content="https://robertsrf.github.io/Lux/marca/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Lux by Emory</title>
  </head>
