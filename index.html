<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4045" />
    <!-- Esta descripcion la lee una clienta, no el dueño: el enlace que se
         comparte por WhatsApp cae en el catalogo. Decia "sistema de
         inventario y ventas", que es como se llama esto puertas adentro. -->
    <meta name="description" content="Joyería hipoalergénica en Sabana de Mendoza. Piezas que no manchan ni irritan la piel." />

    <!-- Sello L en verde profundo, generado por npm run logos -->
    <link rel="icon" type="image/png" sizes="32x32" href="./marca/favicon-32.png" />
    <link rel="apple-touch-icon" href="./marca/icono-180.png" />

    <!-- Vista previa al compartir por WhatsApp. Como el sitio es un SPA con
         HashRouter, los rastreadores solo leen estas etiquetas estaticas:
         valen para todo el sitio, no por pantalla. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lux by Emory" />
    <meta property="og:locale" content="es_VE" />
    <!-- Con tildes. El archivo es UTF-8 y esto es lo primero que ve una
         clienta cuando le llega el enlace: escrito sin acentos se lee
         descuidado, y es la portada de la tienda. -->
    <meta property="og:title" content="Lux by Emory — Catálogo" />
    <meta property="og:description" content="Joyería hipoalergénica. Mira las piezas disponibles y arma tu pedido al mayor." />
    <meta property="og:url" content="https://robertsrf.github.io/Lux/#/publico" />
    <meta property="og:image" content="https://robertsrf.github.io/Lux/marca/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos estructurados. Lo que hace: que cuando alguien busque joyería
         en la zona, Google sepa que esto es una tienda y dónde queda, en vez
         de adivinarlo del texto.

         LO QUE NO LLEVA, Y ES A PROPÓSITO: teléfono, dirección exacta,
         horario y rango de precios. Son campos que Google premia, pero
         ponerlos con datos inventados es peor que no ponerlos: la clienta
         llega a una hora que no abrimos. Cuando quieras, me los das y los
         agrego. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JewelryStore",
        "name": "Lux by Emory",
        "description": "Joyería hipoalergénica: piezas que no manchan ni irritan la piel.",
        "url": "https://robertsrf.github.io/Lux/#/publico",
        "image": "https://robertsrf.github.io/Lux/marca/og.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sabana de Mendoza",
          "addressCountry": "VE"
        }
      }
    </script>

    <title>Lux by Emory</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
