name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sin estas variables el sitio se publica sin poder hablar con Supabase.
      # Mejor fallar aqui que publicar una pantalla de error.
      - name: Comprobar variables de Supabase
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Faltan VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY."
            echo "Ponlas en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # La anon key de Supabase es publica por diseno: puede ir como variable
      # del repositorio. La service_role key JAMAS entra aqui.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # Pages hay que encenderlo UNA vez a mano en Settings > Pages > Source:
      # GitHub Actions. GITHUB_TOKEN no puede crear el sitio ("Resource not
      # accessible by integration"). Con el sitio ya creado, esto es un no-op.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
