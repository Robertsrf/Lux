name: Desplegar a Cloudflare

# Desde la fase 2 (19/11/2026) el sitio lo sirve Cloudflare, en
# luxbyemory.com, entrar.luxbyemory.com y <usuario>.luxbyemory.com
# (wrangler.jsonc). GitHub Pages queda solo como reenvío de la dirección
# vieja (robertsrf.github.io/Lux/#/...), que sale en imágenes publicadas.
#
# Un push a main publica las dos cosas. Cloudflare es UNA sola tienda: lo
# que se publica ahí es lo que ven las clientas. Por eso otra rama solo se
# publica si al pedir "Run workflow" se marca "publicar_rama" (se usó una
# vez, para poner en marcha el dominio antes de fusionar la fase 2), y
# github.io nunca cambia desde otra rama.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar_rama:
        description: 'Publicar ESTA rama en la tienda de verdad (Cloudflare). Solo para poner en marcha algo antes de fusionar.'
        type: boolean
        default: false

# Por trabajo, lo mínimo: construir corre `npm ci` con dependencias de
# terceros, y no necesita poder escribir en Pages ni pedir identidad.
permissions:
  contents: read

# Nunca se corta un despliegue a medias: el siguiente espera.
concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  construir:
    if: github.ref == 'refs/heads/main' || inputs.publicar_rama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sin estas variables el sitio se publica sin poder hablar con Supabase,
      # o con los enlaces armados para una sola dirección. Mejor fallar aquí.
      - name: Comprobar variables
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Faltan VITE_SUPABASE_URL y/o VITE_SUPABASE_ANON_KEY."
            echo "Ponlas en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$DOMINIO" ]; then
            echo "Falta VITE_DOMINIO_BASE (luxbyemory.com)."
            echo "Ponla en Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          DOMINIO: ${{ vars.VITE_DOMINIO_BASE }}

      - run: npm run pruebas

      # La anon key de Supabase es pública por diseño: puede ir como variable
      # del repositorio. La service_role key JAMÁS entra aquí.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_DOMINIO_BASE: ${{ vars.VITE_DOMINIO_BASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  cloudflare:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Comprobar el acceso a Cloudflare
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CUENTA" ]; then
            echo "Faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID."
            echo "Ponlos en Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Se publica desde una carpeta con SOLO lo que el Worker necesita, sin
      # package.json: la acción instala wrangler ahí con el token en su
      # entorno, y en la raíz instalaría todas las dependencias del sitio
      # (con sus scripts de instalación) viendo ese token.
      - name: Preparar lo que se publica
        run: |
          mkdir -p publicar/cloudflare publicar/src/lib
          cp wrangler.jsonc publicar/
          cp cloudflare/*.js cloudflare/*.mjs publicar/cloudflare/
          cp src/lib/dominio.ts publicar/src/lib/
          mv dist publicar/dist

      # Fijada a un commit exacto, no a una etiqueta: esta acción recibe el
      # token de Cloudflare, y una etiqueta se puede mover. Se sube a mano.
      # wrangler también va fijado: una versión nueva no entra sin probarla.
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.157.0'
          workingDirectory: publicar
          command: deploy --var SUPABASE_URL:${{ vars.VITE_SUPABASE_URL }} --var SUPABASE_ANON_KEY:${{ vars.VITE_SUPABASE_ANON_KEY }}

  # El reenvío de github.io. Solo desde main, solo si Cloudflare publicó y
  # solo si el dominio responde de verdad: nunca se manda a la gente a un
  # dominio que no abre (por ejemplo, con el DNS a medio poner).
  reenvio:
    needs: cloudflare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Comprobar que el dominio responde
        run: |
          for u in "https://$DOMINIO/" "https://entrar.$DOMINIO/"; do
            curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$u" || { echo "No responde $u: github.io se queda como estaba."; exit 1; }
          done
        env:
          DOMINIO: ${{ vars.VITE_DOMINIO_BASE }}

      - uses: actions/checkout@v4

      # Pages hay que encenderlo UNA vez a mano en Settings > Pages > Source:
      # GitHub Actions. Con el sitio ya creado, esto es un no-op.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reenvio-github

      - id: despliegue
        uses: actions/deploy-pages@v4
